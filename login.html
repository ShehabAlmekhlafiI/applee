<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Tech - تسجيل الدخول والحساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 10%, #1a233a 0%, #0b0f19 70%);
            background-attachment: fixed;
            background-size: cover;
            color: #f1f1f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-card {
            background-color: rgba(26, 26, 26, 0.9);
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-control {
            background-color: #151a28;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus {
            background-color: #151a28;
            color: #fff;
            border-color: #0dcaf0;
            box-shadow: 0 0 10px rgba(13, 202, 240, 0.3);
        }
        .nav-pills .nav-link { color: #ccc; font-size: 0.85rem; }
        .nav-pills .nav-link:hover, .nav-pills .nav-link.active { background-color: #0dcaf0; color: #000; font-weight: bold; }
        .text-clear-muted { color: #cfcfcf !important; }
    </style>
</head>
<body>

    <div class="container mt-4 mb-5" style="max-width: 650px;">
        
        <!-- شريط التنقل الشامل -->
        <div class="custom-card p-3 mb-4 text-center">
            <h3 class="text-info mb-3"><i class="bi bi-apple"></i> Apple Tech</h3>
            <ul class="nav nav-pills nav-fill justify-content-center gap-1">
                <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                <li class="nav-item"><a class="nav-link" href="hardware.html">المنتجات</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">تواصل معنا</a></li>
                <li class="nav-item"><a class="nav-link active" href="login.html">دخول وحساب</a></li>
            </ul>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="loginSection" class="custom-card p-4 mb-4">
            <h4 class="text-info mb-3"><i class="bi bi-box-arrow-in-left"></i> تسجيل الدخول</h4>
            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label text-clear-muted">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-clear-muted">كلمة المرور (6 خانات على الأقل)</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="****" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="#" onclick="showForgotPassword(event)" class="text-info small text-decoration-none">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="btn btn-info w-100 fw-bold mb-3">تسجيل الدخول</button>
            </form>
            <hr class="border-secondary">
            <div class="text-center mt-3">
                <p class="text-clear-muted small mb-2">ليس لديك حساب مسجل؟</p>
                <button type="button" onclick="showRegisterSection()" class="btn btn-outline-info btn-sm w-100">إنشاء حساب جديد</button>
            </div>
        </div>

        <!-- نموذج إنشاء حساب جديد (لتسجيل حساب أولي يقبله النظام) -->
        <div id="registerSection" class="custom-card p-4 mb-4" style="display: none;">
            <h4 class="text-info mb-3"><i class="bi bi-person-plus"></i> إنشاء حساب جديد</h4>
            <form onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label class="form-label text-clear-muted">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-clear-muted">كلمة المرور الجديدة (6 خانات على الأقل)</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="6 خانات أو أكثر" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mb-2">حفظ وإنشاء الحساب</button>
                <button type="button" onclick="showLogin()" class="btn btn-outline-secondary w-100 btn-sm">العودة لتسجيل الدخول</button>
            </form>
        </div>

        <!-- نموذج استعادة كلمة المرور المحاكي للواقع -->
        <div id="forgotSection" class="custom-card p-4 mb-4" style="display: none;">
            <h4 class="text-info mb-3"><i class="bi bi-key"></i> استعادة كلمة المرور</h4>
            <p class="text-clear-muted small">أدخل بريدك المسجل لنتحقق من وجوده ونرسل لك رمز التحقق وكلمة المرور الحالية.</p>
            
            <!-- الخطوة 1: التحقق من الإيميل -->
            <div id="step1Email">
                <div class="mb-3">
                    <label class="form-label text-clear-muted">البريد الإلكتروني المسجل</label>
                    <input type="email" id="recoveryEmail" class="form-control" placeholder="name@example.com">
                </div>
                <button type="button" onclick="sendResetCode()" class="btn btn-warning w-100 fw-bold mb-2">إرسال رمز التحقق للبريد</button>
                <button type="button" onclick="showLogin()" class="btn btn-outline-secondary w-100 btn-sm">العودة لتسجيل الدخول</button>
            </div>

            <!-- الخطوة 2: إدخال الكود وتحديث كلمة المرور -->
            <div id="step2NewPassword" style="display: none;">
                <div id="emailAlertMsg" class="alert alert-info py-2 small mb-3" role="alert">
                    <!-- تفاصيل البريد والرمز وكلمة المرور الحالية -->
                </div>
                <div class="mb-3">
                    <label class="form-label text-clear-muted">أدخل رمز التحقق (OTP) الوارد في البريد</label>
                    <input type="text" id="otpCodeInput" class="form-control" placeholder="أدخل الرمز المكون من 6 أرقام">
                </div>
                <div class="mb-3">
                    <label class="form-label text-clear-muted">كلمة المرور الجديدة (6 خانات على الأقل)</label>
                    <input type="password" id="newPasswordInput" class="form-control" placeholder="أدخل كلمة مرور جديدة قوية">
                </div>
                <button type="button" onclick="confirmNewPassword()" class="btn btn-success w-100 fw-bold mb-2">تحديث كلمة المرور والحفظ</button>
                <button type="button" onclick="showLogin()" class="btn btn-outline-secondary w-100 btn-sm">إلغاء والعودة</button>
            </div>
        </div>

        <footer class="text-center text-clear-muted mb-4">
            <small>جميع الحقوق محفوظة © Apple Tech 2026</small>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // دالة التحقق من صحة الإيميل
        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        // إظهار وإخفاء الأقسام
        function showLogin() {
            document.getElementById('forgotSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        function showRegisterSection() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('forgotSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
        }

        function showForgotPassword(e) {
            e.preventDefault();
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('forgotSection').style.display = 'block';
            document.getElementById('step1Email').style.display = 'block';
            document.getElementById('step2NewPassword').style.display = 'none';
            document.getElementById('recoveryEmail').value = '';
        }

        // 1. تسجيل حساب جديد وحفظه محلياً
        function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (!isValidEmail(email)) {
                alert('البريد الإلكتروني المدخل غير صالح!');
                return;
            }
            if (pass.length < 6) {
                alert('شروط كلمة المرور: يجب ألا تقل عن 6 خانات!');
                return;
            }

            // حفظ الحساب في التخزين المحلي للمتصفح
            localStorage.setItem('user_email', email);
            localStorage.setItem('user_pass', pass);

            alert('تم إنشاء الحساب بنجاح وتم حفظه في النظام! يمكنك الآن تسجيل الدخول به.');
            showLogin();
        }

        // متغيرات مؤقتة لمحاكاة عملية الاستعادة
        let generatedOtp = '';
        let targetRecoveryEmail = '';

        // 2. طلب استعادة كلمة المرور وإرسالها بريدياً (محاكاة حقيقية)
        function sendResetCode() {
            const email = document.getElementById('recoveryEmail').value.trim();

            if (!isValidEmail(email)) {
                alert('الرجاء إدخال بريد إلكتروني صالح!');
                return;
            }

            // التحقق هل الحساب مسجل مسبقاً أم لا
            const savedEmail = localStorage.getItem('user_email');
            const savedPass = localStorage.getItem('user_pass');

            if (!savedEmail || savedEmail !== email) {
                alert('عذراً، هذا البريد الإلكتروني غير مسجل في النظام لدينا! يرجى إنشاء حساب جديد أو التأكد من البريد.');
                return;
            }

            // توليد رمز تحقق عشوائي من 6 أرقام
            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
            targetRecoveryEmail = email;

            // إظهار تنبيه يمثل ما وصل إلى البريد الإلكتروني الحقيقي للمستخدم
            document.getElementById('emailAlertMsg').innerHTML = `
                <i class="bi bi-envelope-check-fill text-info"></i> <b>محاكاة بريد إلكتروني حقيقي:</b><br>
                تم إرسال رسالة إلى: <u>${email}</u><br>
                - رمز التحقق (OTP): <b>${generatedOtp}</b><br>
                - كلمة المرور الحالية لحسابك هي: <b>${savedPass}</b>
            `;

            // الانتقال للخطوة الثانية
            document.getElementById('step1Email').style.display = 'none';
            document.getElementById('step2NewPassword').style.display = 'block';
        }

        // 3. تأكيد رمز التحقق وتحديث كلمة المرور الجديدة
        function confirmNewPassword() {
            const enteredOtp = document.getElementById('otpCodeInput').value.trim();
            const newPass = document.getElementById('newPasswordInput').value;

            if (enteredOtp !== generatedOtp) {
                alert('خطأ: رمز التحقق (OTP) غير صحيح! تأكد من الرقم الوارد في البريد.');
                return;
            }

            if (newPass.length < 6) {
                alert('شروط كلمة المرور: يجب ألا تقل كلمة المرور الجديدة عن 6 خانات!');
                return;
            }

            // تحديث كلمة المرور في النظام المحلي
            localStorage.setItem('user_pass', newPass);

            alert('تم التحقق من البريد بنجاح وتحديث كلمة المرور الجديدة! يمكنك الآن تسجيل الدخول بها.');
            showLogin();
        }

        // 4. شرط تسجيل الدخول (لا يدخل إلا لحساب قد أنشئ مسبقاً ومطابق)
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (!isValidEmail(email)) {
                alert('يرجى إدخال بريد إلكتروني صالح!');
                return;
            }

            if (pass.length < 6) {
                alert('كلمة المرور يجب ألا تقل عن 6 خانات!');
                return;
            }

            const savedEmail = localStorage.getItem('user_email');
            const savedPass = localStorage.getItem('user_pass');

            // التحقق من أن الحساب مسجل ومطابق تماماً
            if (!savedEmail || savedEmail !== email || savedPass !== pass) {
                alert('خطأ في تسجيل الدخول: البريد الإلكتروني أو كلمة المرور غير مطابقة لحساب مسجل مسبقاً! يرجى إنشاء حساب جديد أو التأكد من البيانات.');
                return;
            }

            alert('مرحباً بك يا مهندس شهاب، تم تسجيل الدخول بنجاح إلى حسابك المعتمد!');
        }
    </script>
</body>
</html>
